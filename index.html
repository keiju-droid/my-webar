<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR - Tap to Place</title>
    <!-- A-Frameライブラリの読み込み -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- WebAR用のA-Frameコンポーネント（WebXR Hit-Test対応） -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-family: sans-serif;
            font-size: 14px;
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="instructions">床や平面をカメラで映し、画面をタップしてモデルを配置してください</div>

    <!-- A-Frame シーンの定義 -->
    <a-scene 
        webxr="requiredFeatures: hit-test, local-floor; optionalFeatures: dom-overlay; overlayElement: #instructions;"
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true;"
        ar-hit-test="target: #model;">
        
        <!-- アセット（3Dモデル）の事前読み込み -->
        <a-assets>
            <!-- model.glb の部分をご自身のファイル名に変更してください -->
            <a-asset-item id="target-model" src="model.glb"></a-asset-item>
        </a-assets>

        <!-- カメラ -->
        <a-entity camera></a-entity>

        <!-- タップで配置される3Dモデル（最初は非表示、タップで出現＆移動） -->
        <a-entity 
            id="model" 
            gltf-model="#target-model" 
            scale="0.5 0.5 0.5" 
            position="0 0 0"
            visible="false">
        </a-entity>
    </a-scene>
</body>
</html>
