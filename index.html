<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR - Click to Place</title>
    <!-- A-Frameと、タッチインタラクション用のスクリプト -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script>
        // 画面をタップしたときにモデルの位置をカメラの前に移動させるコンポーネント
        AFRAME.registerComponent('click-to-place', {
            init: function () {
                const sceneEl = document.querySelector('a-scene');
                const modelEl = document.querySelector('#model');

                sceneEl.addEventListener('click', (event) => {
                    // 画面中央（またはタップした位置）にモデルを表示・移動させる
                    modelEl.setAttribute('visible', 'true');
                    
                    // カメラの向きから少し前方にモデルを配置する簡易的な配置
                    const cameraEl = document.querySelector('[camera]');
                    const position = cameraEl.object3D.position.clone();
                    const direction = new THREE.Vector3();
                    cameraEl.object3D.getWorldDirection(direction);
                    
                    // カメラの向いている方向に1.5メートル離した位置に配置
                    position.addScaledVector(direction, -1.5);
                    modelEl.object3D.position.copy(position);
                });
            }
        });
    </script>
    <style>
        body { margin: 0; overflow: hidden; }
        #instructions {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7); color: white; padding: 12px 24px;
            border-radius: 30px; font-family: sans-serif; font-size: 14px; z-index: 10;
        }
    </style>
</head>
<body click-to-place>
    <div id="instructions">画面をタップしてモデルを出現させてください</div>

    <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-assets>
            <a-asset-item id="target-model" src="model.glb"></a-asset-item>
        </a-assets>

        <a-entity camera position="0 1.6 0"></a-entity>

        <!-- 3Dモデル -->
        <a-entity 
            id="model" 
            gltf-model="#target-model" 
            scale="0.5 0.5 0.5" 
            position="0 0 -1.5"
            visible="false">
        </a-entity>
    </a-scene>
</body>
</html>
