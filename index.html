<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR Box Test</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #ar-button {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: #e53935; color: white; padding: 16px 32px;
            border-radius: 30px; font-size: 16px; font-weight: bold; border: none;
            z-index: 999; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer;
        }
    </style>
</head>
<body>

    <button id="ar-button">赤い箱でARテスト</button>

    <a-scene 
        webxr="requiredFeatures: local-floor; optionalFeatures: hit-test, dom-overlay;"
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true;">

        <!-- カメラ -->
        <a-entity camera position="0 1.6 0"></a-entity>

        <!-- 3Dモデルの代わりに、赤いテスト用の箱を目の前に配置 -->
        <a-box 
            position="0 1 -1.5" 
            rotation="0 45 0" 
            color="#ef2d5e" 
            depth="0.5" 
            height="0.5" 
            width="0.5">
        </a-box>

        <!-- 空（背景） -->
        <a-sky color="#ECECEC"></a-sky>
    </a-scene>

    <script>
        const sceneEl = document.querySelector('a-scene');
        const arButton = document.getElementById('ar-button');
        arButton.addEventListener('click', () => {
            if (sceneEl.enterVR) {
                sceneEl.enterVR();
            }
        });
    </script>
</body>
</html>
