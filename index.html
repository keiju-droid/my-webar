<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR - Initial Display Test</title>
    <!-- A-Frameライブラリの読み込み -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- WebAR用のA-Frameコンポーネント（WebXR対応） -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-family: sans-serif;
            font-size: 14px;
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="instructions">カメラの前に3Dモデルが表示されています</div>

    <!-- A-Frame シーンの定義 -->
    <a-scene 
        webxr="requiredFeatures: local-floor; optionalFeatures: dom-overlay; overlayElement: #instructions;"
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true;">
        
        <!-- アセット（3Dモデル）の事前読み込み -->
        <a-assets>
            <a-asset-item id="target-model" src="model.glb"></a-asset-item>
        </a-assets>

        <!-- カメラ -->
        <a-entity camera position="0 1.6 0"></a-entity>

        <!-- 最初から目の前（前方1.5m、少し下）に表示される3Dモデル -->
        <a-entity 
            gltf-model="#target-model" 
            scale="0.5 0.5 0.5" 
            position="0 0 -1.5"
            rotation="0 0 0">
        </a-entity>
    </a-scene>
</body>
</html>
